[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sign-semantics"
version = "0.1.0"
description = "Self-supervised sentence-level sign-language representation learning for RSA"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "torch>=2.2",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
sign-prepare = "sign_semantics.prepare:main"
sign-cluster = "sign_semantics.cluster:main"
sign-pretrain = "sign_semantics.train:main"
sign-extract = "sign_semantics.extract:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

