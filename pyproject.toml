[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sign-semantics"
version = "0.3.0"
description = "Self-supervised Skeleton BERT pretraining on YouTube-ASL sentence trajectories"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "torch>=2.2",
  "transformers>=5.0,<6",
  "tqdm>=4.66",
  "remotezip>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
sign-pretrain = "sign_semantics.train:main"
sign-extract = "sign_semantics.extract:main"
sign-extract-words = "sign_semantics.word_extract:main"
sign-embed-text = "sign_semantics.text_embed:main"
sign-rsa = "sign_semantics.rsa:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
